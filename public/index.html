<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PinForge Pinterest Publisher</title><style>body{font-family:system-ui;max-width:1200px;margin:auto;padding:24px;background:#f6f7f9}section{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px;margin:16px 0}button{padding:9px 13px;border:0;border-radius:8px;background:#111;color:#fff;cursor:pointer}.secondary{background:#eee;color:#111}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left}.ok{color:#087443}.bad{color:#b42318}</style></head><body><h1>PinForge Pinterest Publisher</h1><p>Import → Select All → Approve → Queue → Pinterest.</p><section><h2>Accounts</h2><button onclick="add()">+ Add account</button> <button class="secondary" onclick="load()">Refresh</button><div id="accounts">Loading…</div></section><section><h2>Import PinForge XLSX/CSV</h2><input id="f" type="file" accept=".xlsx,.xls,.csv"> <button onclick="imp()">Import</button><p id="im"></p></section><section><h2>Imports</h2><div id="imports">Loading…</div></section><section><h2>Queue</h2><div id="queue">Loading…</div></section><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
const $=x=>document.getElementById(x);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(u,o={}){let r=await fetch(u,{...o,headers:{'Content-Type':'application/json',...(o.headers||{})}}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function load(){let a=await api('/api/accounts');$('accounts').innerHTML=a.accounts.length?'<table><tr><th>ID</th><th>Name</th><th>Pinterest</th><th>Status</th><th></th></tr>'+a.accounts.map(x=>`<tr><td>${x.id}</td><td>${esc(x.name)}</td><td>${esc(x.pinterest_username||'—')}<br>${esc(x.pinterest_user_id||'')}</td><td class="${x.status==='connected'?'ok':'bad'}">${x.status}</td><td>${x.status==='connected'?`<button onclick="boards('${x.id}')">Boards</button>`:`<button onclick="connect('${x.id}')">Connect</button>`}</td></tr>`).join('')+'</table>':'No accounts.';let i=await api('/api/imports');$('imports').innerHTML=i.imports.length?'<table><tr><th>File</th><th>Rows</th><th>Approved</th><th></th></tr>'+i.imports.map(x=>`<tr><td>${esc(x.filename)}</td><td>${x.row_count}</td><td>${x.approved_count}</td><td><button onclick="approve('${x.id}')">Select All → Approve</button></td></tr>`).join('')+'</table>':'No imports.';let q=await api('/api/queue');$('queue').innerHTML=q.pins.length?'<table><tr><th>Account</th><th>When</th><th>Title</th><th>Status</th><th>Error</th></tr>'+q.pins.map(x=>`<tr><td>${x.account_id}</td><td>${new Date(x.publish_at*1000).toLocaleString()}</td><td>${esc(x.title)}</td><td>${x.status}</td><td>${esc(x.last_error||'')}</td></tr>`).join('')+'</table>':'Queue empty.'}
async function add(){let n=prompt('Account name','German Food 01');if(!n)return;let d=await api('/api/accounts',{method:'POST',body:JSON.stringify({name:n})});connect(d.id)}function connect(id){location='/api/oauth/start?account_id='+encodeURIComponent(id)}async function boards(id){let d=await api('/api/accounts/'+id+'/boards');alert(d.boards.map(x=>x.name+' → '+x.id).join('\n')||'No boards')}
async function imp(){let f=$('f').files[0];if(!f)return alert('Choose a file');let b=await f.arrayBuffer(),w=f.name.endsWith('.csv')?XLSX.read(new TextDecoder().decode(b),{type:'string'}):XLSX.read(b,{type:'array'}),rows=XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{defval:''});let d=await api('/api/imports',{method:'POST',body:JSON.stringify({filename:f.name,rows})});$('im').textContent=`Imported ${d.row_count} rows. Nothing published.`;load()}async function approve(id){if(!confirm('Approve ALL Pins in this file?'))return;let d=await api('/api/imports/'+id+'/approve',{method:'POST'});alert('Approved '+d.approved_count+' Pins');load()}load().catch(e=>alert(e.message));</script></body></html>
